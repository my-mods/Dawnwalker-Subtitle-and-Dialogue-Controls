[Mod]
Id = UIAndSubtitles
Name = UI and Subtitles - Configurable Font and Text Size
Author = oOCamilleOo
Version = 0.1.0
Description = Independent text sizes and fonts for subtitles, dialogue and supported UI labels.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Apply text appearance controls. Off restores values still owned by this mod.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.subtitlePercent]
Id = subtitlePercent
Type = percent
Label = Cinematic subtitle size
Description = Size of spoken cinematic lines, speaker names and movie subtitles. 100% keeps the original size.
Group = Text size
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 75
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = subtitlePercent

[Setting.dialoguePercent]
Id = dialoguePercent
Type = percent
Label = Dialogue choice size
Description = Size of dialogue response choices and quantity labels. 100% keeps the original size.
Group = Text size
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = dialoguePercent

[Setting.gameplayPercent]
Id = gameplayPercent
Type = percent
Label = Gameplay subtitle size
Description = Size of gameplay, accessibility and overhead NPC subtitles. Distance scaling stays active.
Group = Text size
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = gameplayPercent

[Setting.fontFamily]
Id = fontFamily
Type = picker
Label = Subtitle and dialogue font
Description = Choose vanilla Afacad or Alegreya for these text areas. Other interface text is unchanged.
Group = Font
PresetValues = 0|1
PresetLabels = Vanilla (Afacad)|Alegreya
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = fontFamily

[Setting.uiPercent]
Id = uiPercent
Type = percent
Label = Other UI text size
Description = Size of menu, inventory descriptions, glossary body, court and other supported UI text. Large screens update progressively.
Group = Other UI
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = uiPercent

[Setting.uiFontFamily]
Id = uiFontFamily
Type = picker
Label = Other UI font
Description = Keep the current font, or select Afacad or Alegreya for supported UI labels and rich-text bodies. Styled spans retain their own fonts.
Group = Other UI
PresetValues = 2|0|1
PresetLabels = Keep current|Vanilla (Afacad)|Alegreya
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = uiFontFamily

[Setting.debugLogging]
Id = debugLogging
Type = toggle
Label = Logging
Description = Record failures and aggregate update counts and timings in ue4ss/UE4SS.log.
Group = Diagnostics
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
